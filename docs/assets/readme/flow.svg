<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470" role="img" aria-label="How a contest runs. Before: lock the prize, the organiser creates the contest and sends the prize with createContest. During: fill the room, attendees vote from their phones and Room and Gated modes check presence on-chain. After: the contract pays, anyone calls finalize, ties split equally and no votes refunds the organiser."><title>How a contest runs. Before: lock the prize, the organiser creates the contest and sends the prize with createContest. During: fill the room, attendees vote from their phones and Room and Gated modes check presence on-chain. After: the contract pays, anyone calls finalize, ties split equally and no votes refunds the organiser.</title><style>@font-face{font-family:'Arena Display';src:url(data:font/woff;base64,) format('woff');font-weight:400;font-style:normal}.fd{font-family:'Arena Display',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}@font-face{font-family:'Arena Text';src:url(data:font/woff;base64,) format('woff');font-weight:400;font-style:normal}.fb{font-family:'Arena Text',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}@font-face{font-family:'Arena Mono';src:url(data:font/woff;base64,) format('woff');font-weight:400;font-style:normal}.fm{font-family:'Arena Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@font-face{font-family:'Arena Mono Medium';src:url(data:font/woff;base64,) format('woff');font-weight:400;font-style:normal}.fmb{font-family:'Arena Mono Medium',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}text{font-variant-numeric:tabular-nums}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="clip"><rect width="1600" height="470" rx="32"/></clipPath><pattern id="dg" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#15171B"/></pattern></defs><g clip-path="url(#clip)"><rect width="1600" height="470" fill="#090A0D"/><rect width="1600" height="470" fill="url(#dg)"/></g><rect x=".75" y=".75" width="1598.5" height="468.5" rx="31.25" fill="none" stroke="#23252B" stroke-width="1.5"/><rect x="44" y="42" width="96" height="30" rx="15" fill="#FF7350"/><text x="92.0" y="62.0" class="fmb" font-size="12" fill="#090A0D" letter-spacing="1.5" text-anchor="middle">3 STOPS</text><text x="156.0" y="63.0" class="fm" font-size="15" fill="#A2A4AB" letter-spacing="2">ONE CONTEST, START TO PAYOUT</text><text x="1556.0" y="63.0" class="fm" font-size="15" fill="#787A80" letter-spacing="2" text-anchor="end">NO OWNER  /  NO ADMIN KEYS</text><path d="M96,178 H1504" stroke="#2A2C32" stroke-width="10" stroke-linecap="round"/><path pathLength="1" d="M96,178 H1504" stroke="#F4F5F7" stroke-width="10" stroke-linecap="round"/><path id="line" d="M96,178 H1504" fill="none"/><g><animateMotion dur="9s" repeatCount="indefinite"><mpath href="#line"/></animateMotion><rect x="-22" y="-7" width="44" height="14" rx="7" fill="#FF7350"/></g><circle cx="300" cy="178" r="19" fill="#090A0D" stroke="#F4F5F7" stroke-width="5"/><circle cx="300" cy="178" r="8" fill="#F4F5F7"/><text x="300.0" y="128.0" class="fmb" font-size="16" fill="#FF8D69" letter-spacing="2.2" text-anchor="middle">01  BEFORE</text><text x="300.0" y="266.0" class="fd" font-size="40" fill="#F4F5F7" letter-spacing="-1.1" text-anchor="middle">Lock the prize.</text><text x="300.0" y="316.0" class="fb" font-size="24" fill="#A2A4AB" text-anchor="middle">The organiser creates the contest and</text><text x="300.0" y="350.0" class="fb" font-size="24" fill="#A2A4AB" text-anchor="middle">sends the prize with createContest.</text><text x="300.0" y="384.0" class="fb" font-size="24" fill="#A2A4AB" text-anchor="middle">It can't be taken back.</text><circle cx="800" cy="178" r="19" fill="#090A0D" stroke="#F4F5F7" stroke-width="5"/><circle cx="800" cy="178" r="8" fill="#FF7350"/><text x="800.0" y="128.0" class="fmb" font-size="16" fill="#FF8D69" letter-spacing="2.2" text-anchor="middle">02  DURING</text><text x="800.0" y="266.0" class="fd" font-size="40" fill="#F4F5F7" letter-spacing="-1.1" text-anchor="middle">Fill the room.</text><text x="800.0" y="316.0" class="fb" font-size="24" fill="#A2A4AB" text-anchor="middle">Attendees vote from their phones.</text><text x="800.0" y="350.0" class="fb" font-size="24" fill="#A2A4AB" text-anchor="middle">Room and Gated modes check presence</text><text x="800.0" y="384.0" class="fb" font-size="24" fill="#A2A4AB" text-anchor="middle">on-chain; the hemicycle fills live.</text><circle cx="1300" cy="178" r="19" fill="#090A0D" stroke="#F4F5F7" stroke-width="5"/><circle cx="1300" cy="178" r="8" fill="#F4C855"/><text x="1300.0" y="128.0" class="fmb" font-size="16" fill="#FF8D69" letter-spacing="2.2" text-anchor="middle">03  AFTER</text><text x="1300.0" y="266.0" class="fd" font-size="40" fill="#F4F5F7" letter-spacing="-1.1" text-anchor="middle">The contract pays.</text><text x="1300.0" y="316.0" class="fb" font-size="24" fill="#A2A4AB" text-anchor="middle">Anyone calls finalize. Ties split</text><text x="1300.0" y="350.0" class="fb" font-size="24" fill="#A2A4AB" text-anchor="middle">equally, no votes refunds the</text><text x="1300.0" y="384.0" class="fb" font-size="24" fill="#A2A4AB" text-anchor="middle">organiser, winners withdraw.</text></svg>