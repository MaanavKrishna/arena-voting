<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720" role="img" aria-label="Prize locked in the contract. The prize is already locked: the organiser sends it with createContest, it can't be taken back, and the timeline and entries can't change once voting starts. No owner, no admin keys, no upgrades."><title>Prize locked in the contract. The prize is already locked: the organiser sends it with createContest, it can't be taken back, and the timeline and entries can't change once voting starts. No owner, no admin keys, no upgrades.</title><style>@font-face{font-family:'Arena Display';src:url(data:font/woff;base64,) format('woff');font-weight:400;font-style:normal}.fd{font-family:'Arena Display',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}@font-face{font-family:'Arena Text';src:url(data:font/woff;base64,) format('woff');font-weight:400;font-style:normal}.fb{font-family:'Arena Text',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}@font-face{font-family:'Arena Mono';src:url(data:font/woff;base64,) format('woff');font-weight:400;font-style:normal}.fm{font-family:'Arena Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@font-face{font-family:'Arena Mono Medium';src:url(data:font/woff;base64,) format('woff');font-weight:400;font-style:normal}.fmb{font-family:'Arena Mono Medium',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}text{font-variant-numeric:tabular-nums}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="clip"><rect width="1300" height="720" rx="32"/></clipPath><pattern id="dg" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#15171B"/></pattern></defs><g clip-path="url(#clip)"><rect width="1300" height="720" fill="#090A0D"/><rect width="1300" height="480" fill="url(#dg)"/></g><rect x=".75" y=".75" width="1298.5" height="718.5" rx="31.25" fill="none" stroke="#23252B" stroke-width="1.5"/><text x="56.0" y="76.0" class="fmb" font-size="16" fill="#FF8D69" letter-spacing="1.5">01</text><text x="100.0" y="76.0" class="fm" font-size="16" fill="#A2A4AB" letter-spacing="2">PRIZE LOCKED IN THE CONTRACT</text><line x1="0" y1="480" x2="1300" y2="480" stroke="#23252B" stroke-width="1.5"/><text x="56.0" y="560.0" class="fd" font-size="54" fill="#F4F5F7" letter-spacing="-1.6">The prize is already locked.</text><text x="56.0" y="612.0" class="fb" font-size="26" fill="#A2A4AB">Sent with createContest, it can't be taken back. The organiser can't change the</text><text x="56.0" y="648.0" class="fb" font-size="26" fill="#A2A4AB">timeline or remove entries once voting starts, and anyone can finalise at the end.</text><circle cx="150" cy="250" r="22" fill="#F4F5F7"/><text x="150.0" y="312.0" class="fm" font-size="17" fill="#A2A4AB" letter-spacing="2" text-anchor="middle">ORGANISER</text><line x1="186" y1="250" x2="434" y2="250" stroke="#F4F5F7" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/><path d="M424,242 L436,250 L424,258" fill="none" stroke="#F4F5F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="310.0" y="230.0" class="fm" font-size="19" fill="#F4F5F7" text-anchor="middle">createContest()</text><rect x="456" y="130" width="388" height="240" rx="22" fill="#121417" stroke="#34363D" stroke-width="1.5"/><text x="484.0" y="174.0" class="fmb" font-size="17" fill="#A2A4AB" letter-spacing="2">ARENA CONTRACT</text><path d="M783,172 v-6 a9,9 0 0 1 18,0 v6" fill="none" stroke="#F4C855" stroke-width="2.6"/><rect x="778" y="171" width="28" height="20" rx="5" fill="#F4C855"/><circle cx="560.0" cy="225.0" r="9" fill="#F4C855"/><circle cx="590.0" cy="225.0" r="9" fill="#F4C855"/><circle cx="620.0" cy="225.0" r="9" fill="#F4C855"/><circle cx="650.0" cy="225.0" r="9" fill="#F4C855"/><circle cx="680.0" cy="225.0" r="9" fill="#F4C855"/><circle cx="710.0" cy="225.0" r="9" fill