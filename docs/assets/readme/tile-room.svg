<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720" role="img" aria-label="The room signal, part of Ground. Only the room can hear it: every 10 seconds the Stage plays the next token as inaudible sound, with a QR fallback, and the contract checks it with no presence server."><title>The room signal, part of Ground. Only the room can hear it: every 10 seconds the Stage plays the next token as inaudible sound, with a QR fallback, and the contract checks it with no presence server.</title><style>@font-face{font-family:'Arena Display';src:url(data:font/woff;base64,) format('woff');font-weight:400;font-style:normal}.fd{font-family:'Arena Display',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}@font-face{font-family:'Arena Text';src:url(data:font/woff;base64,) format('woff');font-weight:400;font-style:normal}.fb{font-family:'Arena Text',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}@font-face{font-family:'Arena Mono';src:url(data:font/woff;base64,) format('woff');font-weight:400;font-style:normal}.fm{font-family:'Arena Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@font-face{font-family:'Arena Mono Medium';src:url(data:font/woff;base64,) format('woff');font-weight:400;font-style:normal}.fmb{font-family:'Arena Mono Medium',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}text{font-variant-numeric:tabular-nums}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.wave{animation:wave 2.4s ease-out infinite}@keyframes wave{0%,100%{opacity:.3}25%{opacity:1}}</style><defs><clipPath id="clip"><rect width="640" height="720" rx="32"/></clipPath><pattern id="dg" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#15171B"/></pattern></defs><g clip-path="url(#clip)"><rect width="640" height="720" fill="#090A0D"/><rect width="640" height="480" fill="url(#dg)"/></g><rect x=".75" y=".75" width="638.5" height="718.5" rx="31.25" fill="none" stroke="#23252B" stroke-width="1.5"/><text x="44.0" y="76.0" class="fmb" font-size="16" fill="#FF8D69" letter-spacing="1.5">02</text><text x="88.0" y="76.0" class="fm" font-size="16" fill="#A2A4AB" letter-spacing="2">THE ROOM SIGNAL / GROUND</text><line x1="0" y1="480" x2="640" y2="480" stroke="#23252B" stroke-width="1.5"/><text x="44.0" y="560.0" class="fd" font-size="44" fill="#F4F5F7" letter-spacing="-1.6">Only the room can hear it.</text><text x="44.0" y="612.0" class="fb" font-size="26" fill="#A2A4AB">Every 10 s the Stage plays a fresh token</text><text x="44.0" y="648.0" class="fb" font-size="26" fill="#A2A4AB">as inaudible sound, with a QR fallback.</text><text x="44.0" y="684.0" class="fb" font-size="26" fill="#A2A4AB">The contract checks it. No server.</text><rect x="64" y="196" width="128" height="84" rx="8" fill="#121417" stroke="#34363D" stroke-width="1.5"/><circle cx="110.00" cy="245.00" r="5.40" fill="#F4F5F7"/><circle cx="115.27" cy="232.27" r="5.40" fill="#F4F5F7"/><circle cx="128.00" cy="227.00" r="5.40" fill="#FF7350"/><circle cx="140.73" cy="232.27" r="5.40" fill="#F4F5F7"/><circle cx="146.00" cy="245.00" r="5.40" fill="#F4F5F7"/><path d="M48,292 H208 L196,302 H60 Z" fill="#34363D"/><text x="128.0" y="334.0" class="fm" font-size="17" fill="#A2A4AB" letter-spacing="2" text-anchor="middle">STAGE</text><path class="wave" style="animation-delay:0.0s" d="M214,206 A46,46 0 0 1 214,270" transform="translate(33,0)" fill="none" stroke="#FF7350" stroke-width="2.2" stroke-linecap="round"/><path class="wave" style="animation-delay:0.3s" d="M214,181 A82,82 0 0 1 214,295" transform="translate(59,0)" fill="none" stroke="#FF7350" stroke-width="2.2" stroke-linecap="round"/><path class="wave" style="animation-delay:0.6s" d="M214,155 A118,118 0 0 1 214,321" transform="translate(85,0)" fill="none" stroke="#FF7350" stroke-width="2.2" stroke-linecap="round"/><path class="wave" style="animation-delay:0.9s" d="M214,130 A154,154 0 0 1 214,346" transform="translate(111,0)" fill="none" stroke="#FF7350" stroke-width="2.2" stroke-linecap="round"/><rect x="430" y="114" width="44" height="72" rx="9" fill="#121417" stroke="#34363D" stroke-width="1.5"/><circle cx="452" cy="150" r="8" fill="#F4F5F7"/><rect x="470" y="212" width="44" height="72" rx="9" fill="#121417" stroke="#34363D" stroke-width="1.5"/><circle cx="492" cy="248" r="8" fill="#F4F5F7"/><rect x="430" y="310" width="44" height="72" rx="9" fill="#121417" stroke="#34363D" stroke-width="1.5"/><circle cx="452" cy="346" r="8" fill="#F4F5F7"/><rect x="548" y="212" width="44" height="72" rx="9" fill="none" stroke="#787A80" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="570" cy="248" r="7" fill="none" stroke="#787A80" stroke-width="1.6"/><text x="570.0" y="314.0" class="fm" font-size="14" fill="#787A80" letter-spacing="1.5" text-anchor="middle">AT HOME</text><text x="44.0" y="394.0" class="fm" font-size="14" fill="#787A80" letter-spacing="1.4">TOKENS HASH FORWARD TO THE ON-CHAIN ANCHOR</text><line x1="56" y1="420" x2="504" y2="420" stroke="#34363D" stroke-width="2"/><circle cx="56" cy="420" r="7" fill="none" stroke="#787A80" stroke-width="1.6"/><circle cx="120" cy="420" r="7" fill="none" stroke="#787A80" stroke-width="1.6"/><circle class="pulse" cx="184" cy="420" r="9" fill="#FF7350"/><circle cx="248" cy="420" r="7" fill="#787A80"/><circle cx="312" cy="420" r="7" fill="#787A80"/><circle cx="376" cy="420" r="7" fill="#787A80"/><circle cx="440" cy="420" r="7" fill="#787A80"/><rect x="495" y="411" width="18" height="18" rx="4" fill="#F4F5F7"/><text x="184.0" y="454.0" class="fmb" font-size="14" fill="#FF8D69" letter-spacing="1.5" text-anchor="middle">NOW</text><text x="513.0" y="454.0" class="fmb" font-size="14" fill="#F4F5F7" letter-spacing="1.5" text-anchor="end">ANCHOR</text></svg>