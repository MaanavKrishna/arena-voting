<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Arena</title>
  <desc id="desc">A half-ring of five seats with the centre seat lit, next to the Arena wordmark and the line: The room decides.</desc>
  <rect width="1280" height="320" rx="24" fill="#131416"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="23.5" fill="none" stroke="#26282c"/>

  <g transform="translate(128 9)">
  <!-- five-seat half-ring: centre (350, 214), radius 112 -->
  <path d="M 238 214 A 112 112 0 0 1 462 214" fill="none" stroke="#2a2c31" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
  <circle cx="238" cy="214" r="20" fill="#d9dade"/>
  <circle cx="270.8" cy="134.8" r="20" fill="#d9dade"/>
  <circle cx="350" cy="102" r="24" fill="#f06a3b"/>
  <circle cx="429.2" cy="134.8" r="20" fill="#d9dade"/>
  <circle cx="462" cy="214" r="20" fill="#d9dade"/>
  <circle cx="350" cy="102" r="36" fill="none" stroke="#f06a3b" stroke-opacity="0.28" stroke-width="2"/>

  <text x="540" y="182" fill="#f4f4f5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-4">Arena</text>
  <text x="544" y="236" fill="#a1a1aa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" letter-spacing="-0.3">The room decides.</text>
  </g>
</svg>
