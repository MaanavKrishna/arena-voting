[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.38"
evm_version = "prague"
optimizer = true
optimizer_runs = 10000
fs_permissions = [
  { access = "read", path = "./test/fixtures" },
  { access = "read-write", path = "./deployments" },
]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32

[profile.ci.fuzz]
runs = 1000

[profile.ci.invariant]
runs = 256
depth = 64

[fmt]
line_length = 110
